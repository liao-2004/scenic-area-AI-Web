server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # Vue history 模式：找不到的路由都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Node 后端 API
    location /api/ {
        proxy_pass http://node-server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MQTT 相关接口
    location /mqtt {
        proxy_pass http://node-server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket 支持（如果 MQTT over WS）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Python AI 服务
    location /ai/ {
        proxy_pass http://ai-server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;   # 允许上传图片
    }

    # 静态资源（上传的图片等）
    location /public/ {
        proxy_pass http://node-server:3000;
    }
}