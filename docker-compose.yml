version: '3.8'

services:
  # ---------- MySQL 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: scenic-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-vue_beidou4}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"   # 映射出来方便用 Navicat 连接，不需要可以删
    volumes:
      - mysql_data:/var/lib/mysql          # 数据持久化
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql  # 自动建表
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Node 后端 ----------
  node-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scenic-node
    restart: always
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_NAME: ${DB_NAME:-vue_beidou4}
      TZ: Asia/Shanghai
    ports:
      - "3000:3000"   # 调试用，正式部署可删（只走 Nginx）
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./public:/app/public   # 上传文件持久化

  # ---------- Python AI 服务 ----------
  ai-server:
    build:
      context: ./ai_server
      dockerfile: Dockerfile
    container_name: scenic-ai
    restart: always
    environment:
      ARK_API_KEY: ${ARK_API_KEY:-ark-09b5b85f-814f-402a-8cec-7dda5a32ba05-26b11}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_MODEL: ${ARK_MODEL:-ep-20260612111855-9rkrr}
      AI_SERVER_PORT: "5000"
      TZ: Asia/Shanghai
    ports:
      - "5000:5000"   # 调试用，正式部署可删

  # ---------- Nginx 反向代理 + 前端静态文件 ----------
  nginx:
    image: nginx:alpine
    container_name: scenic-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./web_pc/dist:/usr/share/nginx/html:ro   # 前端 build 产物
    depends_on:
      - node-server
      - ai-server

volumes:
  mysql_data: